name: Shine Universe Ops CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "requests/go.json"

permissions:
  contents: read

concurrency:
  group: shine-universe-ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run verify:config
